[project]
name = "bikeshop"
version = "0.1.0"
description = ""
authors = [
    {name = "kowjeg",email = "test@ya.ru"}
]
requires-python = ">=3.13"
dependencies = [
    "django (>=6.1.1,<7.0.0)",
    "pillow (>=12.3.0,<13.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "psycopg[binary] (>=3.3.5,<4.0.0)",
    "djangorestframework (>=3.18.0,<4.0.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "drf-spectacular (>=0.30.0,<0.31.0)",
    "django-filter (>=26.1,<27.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "mypy (>=2.4.0,<3.0.0)",
    "ruff (>=0.16.10,<0.17.0)",
    "django-stubs (>=6.1.1,<7.0.0)",
    "djangorestframework-stubs (>=3.18.1,<4.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-django (>=4.14.0,<5.0.0)"
]

# ---------- ruff ----------
[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["*/migrations/*", "media", "static"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "DJ", "SIM", "C4", "N"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]

[tool.ruff.lint.isort]
known-first-party = ["config", "orders", "payments", "products", "reviews", "users"]

# ---------- mypy ----------
[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["/migrations/", "^media/", "^static/"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["drf_spectacular.*", "rest_framework_simplejwt.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.development"

# ---------- pytest ----------
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
python_files = ["tests.py", "test_*.py"]
addopts = "--reuse-db"
