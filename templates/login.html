{% extends 'base.html' %}
{% load static %}

{% block title %}
Логин
{% endblock %}

{% block content %}
<main class="auth-page-wrapper">
  <div class="auth-background">
    <img src="{% static 'img/background/pattern-bikes.svg' %}" alt="">
  </div>
  <div class="auth-form-container">
    <div class="auth-container auth-container--login">
      <div class="Legend">
        <h1 class="auth-title">Sign In</h1>
      </div>

      <form class="auth-form" id="login-form" method="post">
          {% csrf_token %}
          <div class="InputField">
          <label for="Username">Логин</label>
          <input type="text" id="username" name="username" class="Input" placeholder="Логин" required>
        </div>
        <div class="InputField">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" class="Input" placeholder="********" required>
        </div>

        <div class="ButtonGroup">
          <button type="submit" class="button button--primary">Вход</button>
        </div>

        <div class="TextLink">
          <a href="forgot_password.html">Забыли пароль?</a>
        </div>
      </form>

      <p class="auth-switch">Нет аккаунта? <a href="{% url 'users:register' %}">Зарегистрироваться</a></p>
    </div>
  </div>
</div>
{% endblock %}
